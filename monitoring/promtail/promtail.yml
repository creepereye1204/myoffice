server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: rhwp-errors
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["^/rhwp-api$", "^/rhwp-web$"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(rhwp-api|rhwp-web)
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: /(rhwp-api|rhwp-web)
        target_label: container
    pipeline_stages:
      # Docker 검색 대상의 로그 본문에서 지정한 오류 레코드만 보관한다.
      - json:
          expressions:
            logger: logger
            kind: kind
            level: level
      - labels:
          logger:
          kind:
          level:
      - match:
          selector: '{container=~".+",logger!~"myoffice[.](client_error|server_error)"}'
          action: drop
          drop_counter_reason: non_error_record
