<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 — 알오피스</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/errors.js" defer></script>
  <script src="/analytics.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth">
    <a class="brand" href="/"><img src="/favicon.svg" alt="" width="34" height="34" /><span>알오피스</span></a>
    <p class="auth-sub">워드 · 엑셀 · 파워포인트 · 한글 · 한셀 · 한쇼를 브라우저에서</p>
    <nav class="seg auth-tabs" role="tablist">
      <button type="button" data-tab="login" class="on">로그인</button>
      <button type="button" data-tab="signup" id="tab-signup">회원가입</button>
    </nav>

    <form id="login-form" class="auth-form">
      <label>아이디<input name="username" autocomplete="username" required autocapitalize="off" /></label>
      <label>비밀번호<input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="btn primary wide" type="submit">로그인</button>
    </form>

    <form id="signup-form" class="auth-form" hidden>
      <label>아이디<input name="username" autocomplete="username" required pattern="[a-z0-9_]{3,20}" autocapitalize="off"
        title="영문 소문자·숫자·밑줄 3~20자" /><small>영문 소문자·숫자·밑줄 3~20자</small></label>
      <label>이름<input name="name" autocomplete="name" required maxlength="30" /><small>함께 편집할 때 다른 사람에게 보입니다</small></label>
      <label>비밀번호<input name="password" type="password" autocomplete="new-password" required minlength="8" /><small>8자 이상</small></label>
      <label>비밀번호 확인<input name="password2" type="password" autocomplete="new-password" required minlength="8" /></label>
      <button class="btn primary wide" type="submit">가입하고 시작하기</button>
    </form>
    <p id="signup-closed" class="auth-note" hidden>지금은 회원가입을 받지 않습니다. 관리자에게 문의하세요.</p>
    <p id="err" class="auth-err" role="alert"></p>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
