<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 — 알오피스</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/errors.js" defer></script>
  <script src="/analytics.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/favicon.svg" alt="" width="28" height="28" /><span>알오피스 관리자</span></a>
    <div class="grow"></div>
    <a class="btn" href="/">내 파일로</a>
  </header>
  <main>
    <h2>사용자</h2>
    <label class="switch"><input type="checkbox" id="signup" /> 새 회원가입 받기</label>
    <p id="summary" class="usage" style="text-align:left"></p>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>아이디</th><th>이름</th><th>상태</th><th class="num">파일</th><th class="num">사용량</th><th>가입</th><th>최근 로그인</th><th></th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
    <section aria-labelledby="feedback-heading">
      <h2 id="feedback-heading">의견 <span class="tag" id="feedback-unread" hidden></span></h2>
      <div class="feedback-admin-controls">
        <label>상태 <select id="feedback-status">
          <option value="">전체</option><option value="new">새 의견</option>
          <option value="read">읽음</option><option value="done">처리 완료</option>
        </select></label>
        <label>종류 <select id="feedback-kind">
          <option value="">전체</option><option value="bug">버그</option>
          <option value="suggestion">제안</option><option value="other">기타</option>
        </select></label>
      </div>
      <div class="table-wrap">
        <table class="admin-table feedback-admin-table">
          <thead><tr><th>종류</th><th>내용</th><th>이메일</th><th>페이지 / 파일 형식</th><th>시각</th><th>세션 ID</th><th>상태</th></tr></thead>
          <tbody id="feedback-rows"></tbody>
        </table>
      </div>
      <div class="feedback-admin-controls">
        <button class="btn" id="feedback-prev" disabled>이전</button>
        <span id="feedback-range" aria-live="polite"></span>
        <button class="btn" id="feedback-next" disabled>다음</button>
      </div>
    </section>
  </main>
  <script type="module" src="/admin.js"></script>
</body>
</html>
