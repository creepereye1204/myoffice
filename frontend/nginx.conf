map $http_upgrade $proxy_connection {
    default upgrade;
    ""      close;
}

# brotli 미리 압축본(.br)을 받을 수 있는 브라우저인지
map $http_accept_encoding $br_ok {
    default 0;
    "~*\bbr\b" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    # 컨테이너 이름을 요청 시점에 해석 (onlyoffice가 늦게 떠도/재생성돼도 OK)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_up http://api:8000;
    set $oo_up  http://onlyoffice;

    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # 앱 셸
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location = /edit  { try_files /edit.html =404;  add_header Cache-Control "no-cache"; }
    location = /login { try_files /login.html =404; add_header Cache-Control "no-cache"; }
    location = /admin { try_files /admin.html =404; add_header Cache-Control "no-cache"; }

    # rhwp-studio (HWP 편집기, vite base=/rhwp/)
    location /rhwp/ {
        try_files $uri $uri/ /rhwp/index.html;
        location /rhwp/assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
        location /rhwp/fonts/  { expires 30d; add_header Cache-Control "public, immutable"; }
        location /rhwp/ext-fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*"; }
        location = /rhwp/sw.js { add_header Cache-Control "no-cache"; }
    }

    # wasm 엔진: br 지원 브라우저에는 미리 압축한 .br (gzip보다 30% 작음)
    location ~ ^/rhwp/assets/.+\.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
        if ($br_ok) { rewrite ^(.*)$ $1.br last; }
    }
    location ~ ^/rhwp/assets/.+\.wasm\.br$ {
        types { }
        default_type application/wasm;
        gzip off;
        gzip_static off;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
    }

    # 같은 출처로 API 접근도 허용 (api.rhwp.p-e.kr 과 동일 백엔드)
    location /api/ {
        proxy_pass $api_up;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /ws/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxy_connection;
        proxy_read_timeout 3600s;
    }
    location /dl/ {
        proxy_pass $api_up;
    }

    # ONLYOFFICE Document Server (가상 경로 /office/)
    location /office/ {
        rewrite ^/office/(.*)$ /$1 break;
        proxy_pass $oo_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxy_connection;
        proxy_set_header X-Forwarded-Host $http_host/office;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
