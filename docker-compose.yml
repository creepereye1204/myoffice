# rhwp office — 웹 워드/엑셀/파워포인트 + 한글(HWP)
#   www.myoffice.p-e.kr → web (프론트 + /rhwp/ HWP 편집기 + /office/ ONLYOFFICE 프록시)
#   api.myoffice.p-e.kr → api (파일 저장/ONLYOFFICE 콜백)
# 호스트 포트는 열지 않는다 — HAProxy가 rhwp_default 네트워크로 컨테이너에 직접 닿는다.
name: rhwp

services:
  web:
    build: ./frontend
    container_name: rhwp-web
    restart: unless-stopped
    depends_on: [api, onlyoffice]

  api:
    build: ./api
    container_name: rhwp-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      DS_INTERNAL_URL: http://onlyoffice/
      API_INTERNAL_URL: http://api:8000
      CORS_ORIGINS: https://www.myoffice.p-e.kr,https://www.rhwp.p-e.kr
      MAX_FILE_MB: "50"
      MAX_WORKSPACE_MB: "500"
    volumes:
      - ./data:/data

  onlyoffice:
    build: ./onlyoffice
    image: rhwp-onlyoffice:9.2
    container_name: rhwp-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      # API 컨테이너(도커 내부 IP)에서 문서를 받아오고 콜백을 보내야 하므로 허용
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      # 참고: Community 판은 변환기(x2t) 워커가 1개라 문서 열기·PDF 변환이 한 줄로 처리된다 (작은 문서 ~1초).
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_logs:/var/log/onlyoffice
      - oo_cache:/var/lib/onlyoffice
      - oo_db:/var/lib/postgresql

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rhwp-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rhwp-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://www.myoffice.p-e.kr/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: rhwp-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  oo_data:
  oo_logs:
  oo_cache:
  oo_db:
  prometheus_data:
  grafana_data:
